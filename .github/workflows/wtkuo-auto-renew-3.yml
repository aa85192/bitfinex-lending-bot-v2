name: 'WTKuo auto-renew-3: fUSD + fUST'

on:
  workflow_dispatch:
  schedule:
    # timezone: UTC
    # 避開整點時間，因為有可能會有時間上的延誤
    - cron: '6-56/10 * * * *'

# GitHub 對排程事件節流得很兇，這個 cron 從來沒有真的每 10 分鐘跑過：
# 2026-08 中旬約 36~52 次/天，8/23 之後（repo 停止有新的 push）掉到 6~9 次/天，
# 兩次執行最長間隔 4h37m，資金歸還後會閒置好幾個小時。
# 排程頻率不是我們能控制的，所以改成「一次觸發覆蓋一段時間」：
# 同一個 job 內以 LOOP_INTERVAL 為間隔重跑 LOOP_COUNT 輪，把 10 分鐘的節奏補回來。
concurrency:
  group: wtkuo-auto-renew-3
  # 不可以設成 true：取消有可能正好落在 auto-funding「先停用再啟用」的空檔，
  # 會把自動出借永久停在停用狀態。設成 false 讓新的觸發排隊，接在前一輪後面跑，
  # 剛好也讓覆蓋時間可以連續銜接。
  cancel-in-progress: false

env:
  # LOOP_COUNT × LOOP_INTERVAL = 覆蓋時間（預設 6 × 600s = 50 分鐘）。
  # public repo 的 Actions 分鐘數免費，想要更接近全天候覆蓋可以把 LOOP_COUNT 調大，
  # 但記得同步調高下面的 timeout-minutes（GitHub 單一 job 上限 6 小時）。
  LOOP_COUNT: '6'
  LOOP_INTERVAL: '600'
  BITFINEX_API_KEY: ${{ secrets.BITFINEX_API_KEY }}
  BITFINEX_API_SECRET: ${{ secrets.BITFINEX_API_SECRET }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

jobs:
  bitfinex:
    # 避免被 fork 的 repository 觸發，請改成自己的 GitHub 帳號
    if: github.repository_owner == 'aa85192'
    # 這個名字必須跟 repo 的 Environments 名稱一樣
    environment: aa85192
    runs-on: ubuntu-latest
    # 要容納 LOOP_COUNT × LOOP_INTERVAL 的迴圈，並留餘裕讓迴圈自己跑完，
    # 而不是被 timeout 砍在 Bitfinex 寫入的半路上
    timeout-minutes: 70
    permissions:
      actions: write # 供下面的 keepalive 步驟呼叫 enable API
      contents: read # actions/checkout
    steps:
      - name: Dump GitHub Context
        run: |
          echo 'env=${{ toJSON(env) }}'
          echo 'github=${{ toJSON(github) }}'
          echo 'inputs=${{ toJSON(inputs) }}'
          echo 'job=${{ toJSON(job) }}'
          echo 'runner=${{ toJSON(runner) }}'
          echo 'secrets=${{ toJSON(secrets) }}'
          echo 'steps=${{ toJSON(steps) }}'
          echo 'vars=${{ toJSON(vars) }}'
      - name: Keep scheduled workflows enabled
        # 公開 repo 只要 60 天沒有 repository activity，GitHub 就會自動停用排程。
        # 本 repo 最後一次 push 是 2026-08-23，換算下來 10 月下旬就會被停用。
        # 這裡直接打 REST API 重新啟用；不使用第三方 action —— 40e7000 當初就是因為
        # 第三方 action 讓整個 workflow 卡在 action_required 沒產生任何 job 才移除的。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in wtkuo-auto-renew-3.yml gh-pages.yml; do
            curl -sS -o /dev/null -w "enable $wf -> %{http_code}\n" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable"
          done
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'yarn'
      - name: Install dependencies, eslint, and run
        env:
          # 保留金額（reserveAmount）改在 config/reserve-amount.json 設定，可透過 webapp 編輯，不寫在這裡
          # rank：掛單利率 = FRR + rank × (24h最高成交利率 − FRR)
          # 天期：利率 ≥ FRR 時固定 120 天；低於 FRR 時用下方 period 對照表插值（短天期）
          INPUT_AUTO_RENEW_3: |
            USD:
              amount: 0
              rank: 0.5
              rateMax: 0.01
              rateMin: 0.0001
              period:
                3: 0.00027397
                4: 0.00030822
                5: 0.00034247
                6: 0.00037671
                7: 0.00041096
                8: 0.00043053
                9: 0.00045010
                10: 0.00046967
                11: 0.00048924
                12: 0.00050881
                13: 0.00052838
                14: 0.00054795
                15: 0.00056751
                16: 0.00058708
                17: 0.00060665
                18: 0.00062622
                19: 0.00064579
                20: 0.00066536
                21: 0.00068493
                22: 0.00070015
                23: 0.00071537
                24: 0.00073059
                25: 0.00074581
                26: 0.00076104
                27: 0.00077626
                28: 0.00079148
                29: 0.00080670
                30: 0.00082192
            UST:
              amount: 0
              rank: 0.5
              rateMax: 0.001
              rateMin: 0.0001918
              period:
                3: 0.00027397
                4: 0.00030822
                5: 0.00034247
                6: 0.00037671
                7: 0.00041096
                8: 0.00043053
                9: 0.00045010
                10: 0.00046967
                11: 0.00048924
                12: 0.00050881
                13: 0.00052838
                14: 0.00054795
                15: 0.00056751
                16: 0.00058708
                17: 0.00060665
                18: 0.00062622
                19: 0.00064579
                20: 0.00066536
                21: 0.00068493
                22: 0.00070015
                23: 0.00071537
                24: 0.00073059
                25: 0.00074581
                26: 0.00076104
                27: 0.00077626
                28: 0.00079148
                29: 0.00080670
                30: 0.00082192
        run: |
          set -ex
          yarn > /dev/null 2>&1
          yarn lint
          ok=0
          fail=0
          for i in $(seq 1 "$LOOP_COUNT"); do
            if [ "$i" -gt 1 ]; then sleep "$LOOP_INTERVAL"; fi
            # 只有最後一輪才發 Telegram，否則同一次觸發會重複通知 LOOP_COUNT 次
            if [ "$i" -eq "$LOOP_COUNT" ]; then export INPUT_NOTIFY=1; else export INPUT_NOTIFY=0; fi
            echo "::group::iteration $i/$LOOP_COUNT"
            if yarn tsx ./bin/funding-auto-renew-3.ts; then ok=$((ok + 1)); else fail=$((fail + 1)); fi
            echo "::endgroup::"
          done
          echo "iterations: ok=$ok fail=$fail"
          # 單一輪失敗（例如撞到 nonce）不該讓整段覆蓋時間報廢，只有全部失敗才紅燈
          [ "$ok" -gt 0 ]
